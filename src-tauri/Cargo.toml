[package]
name = "coffeeshop"
version = "2.0.0"
description = "Offline-first coffee shop POS"
authors = ["Ramin Nasraddinzade"]
license = "MIT"
repository = "https://github.com/nasraddinzade/coffeeshop"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "coffeeshop_lib"
# Desktop only. The mobile targets would also need "staticlib" and "cdylib";
# a cdylib exports every symbol, which the MinGW linker cannot handle
# ("export ordinal too large"). Add them back if the app ever ships on mobile.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
